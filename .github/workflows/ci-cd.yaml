name: CI

on: 
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest] 
        
    runs-on: ${{matrix.os}} 
    
    steps:
      - name: getting source code
        uses: actions/checkout@v4

      - name: setup cmake
        uses: ssrobins/install-cmake@v1
      
      - name: check cmake
        run: cmake --version
      
      - name: install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt update && sudo apt install -y nlohmann-json3-dev libyaml-cpp-dev

      - name: install dependencies (MacOS)
        if: matrix.os == 'macos-latest'
        run: brew install nlohmann-json yaml-cpp

      - name: install dependencies (Win)
        if: matrix.os == 'windows-latest'
        run: vcpkg install nlohmann-json:x64-windows yaml-cpp:x64-windows
        shell: pwsh

      - name: configure project
        run: cmake -S . -B build
          
      - name: build project
        run: cmake --build build --output-on-failure --no-tests=error

      - name: run automatic tests
        run: ctest --test-dir build
