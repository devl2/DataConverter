name: CI

on: 
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest] 
        
    runs-on: ${{matrix.os}} 
    
    steps:
      - name: getting source code
        uses: actions/checkout@v4

      - name: setup build env
        uses: ssrobins/install-cmake@v1
      
      - name: check build env
        run: cmake --version
      
      - name: install dependencies
        run: sudo apt update
          sudo apt install -y nlohmann-json3-dev libyaml-cpp-dev

      - name: configure project
        run: mkdir build && cd build
          cmake -S . -B build
          
      - name: build project
        run: cmake --build build

      - name: run automatic tests
        run: ctest --test-dir build
