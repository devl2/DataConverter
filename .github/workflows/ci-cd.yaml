name: CI

on: 
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest] 
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_GHA_ENABLED: "false"
        
    runs-on: ${{matrix.os}} 
    
    steps:
      - name: getting source code
        uses: actions/checkout@v4

      - name: setup cmake
        uses: ssrobins/install-cmake@v1
      
      - name: check cmake
        run: cmake --version

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      
      - name: Cache compilation
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.sccache
          key: ${{ runner.os }}-cpp17-${{ hashFiles('**/CMakeLists.txt', '**/vcpkg.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cpp17-${{ hashFiles('**/CMakeLists.txt', '**/vcpkg.json') }}-
      
      - name: install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt update && sudo apt install -y nlohmann-json3-dev libyaml-cpp-dev

      - name: install dependencies (MacOS)
        if: matrix.os == 'macos-latest'
        run: brew install nlohmann-json yaml-cpp

      - name: install dependencies (Win)
        if: matrix.os == 'windows-latest'
        run: vcpkg install nlohmann-json:x64-windows yaml-cpp:x64-windows
        shell: pwsh

      - name: configure project
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          
      - name: build project
        run: cmake --build build

      - name: run automatic tests
        run: ctest --test-dir build

      - name: upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: build/
          retention-days: 7

      - name: show cache statistics
        run: sccache --show-stats
        
  deploy:
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-files
          path: build/
